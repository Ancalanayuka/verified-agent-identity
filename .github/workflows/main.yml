name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: Agent name
        required: true
        default: Ancalanayuka
      agent_description:
        description: Agent description
        required: true
        default: Ancalanayuka AI Agent

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ClawHub skill
        run: |
          npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          if [ -d scripts ]; then
            cd scripts
            npm install
            cd ..
          else
            echo "scripts folder not found"
          fi

      - name: Create new Ethereum Identity
        run: |
          node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge "{\"name\":\"${{ github.event.inputs.agent_name }}\",\"description\":\"${{ github.event.inputs.agent_description }}\"}"
